[project]
name = "llm-serve-daemon"
version = "0.1.0"
description = "GPU node agent for LLM cluster management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
    "pynvml>=11.5",
    "psutil>=5.9",
    "podman>=5.0",
    "structlog>=23.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
